# 已有 Caddy 的机器：追加这一段即可（Caddy 按域名自动签证书）
# 没有子域也能用：把域名换成 <你的IP转横线>.sslip.io，例如 43-198-12-34.sslip.io

lan.yourdomain.com {
	encode zstd gzip
	reverse_proxy 127.0.0.1:18100 {
		flush_interval -1
		transport http {
			read_timeout 300s
			write_timeout 300s
		}
	}
	header {
		X-Robots-Tag "noindex, nofollow"
		Referrer-Policy "no-referrer"
	}
}
