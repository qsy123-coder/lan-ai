# /etc/nginx/conf.d/lan.conf
# 澜 · 角色对话站 —— 子域反代（把 lan.yourdomain.com 换成你的子域，两处都要换）
#
# 依赖：deploy/docker-compose.existing.yml 已在跑，站点监听 127.0.0.1:18100
#
# 放置后：
#   nginx -t && systemctl reload nginx

# ① 80 端口：只做跳转 + 给 certbot 验证用
server {
    listen 80;
    listen [::]:80;
    server_name lan.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ② 443：真正的反代
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25 请改成 listen 443 ssl http2;
    server_name lan.yourdomain.com;

    # —— 证书二选一 ——
    # A) 用 certbot 单独给这个子域签（下文第 3 步会自动改写这两行，可先注释掉）
    # ssl_certificate     /etc/letsencrypt/live/lan.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lan.yourdomain.com/privkey.pem;
    # B) 复用你已有的泛域名证书
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 站点是私人的，别被收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ⚠️ 这三行是流式对话的命门：不关缓冲，回复会攒到最后一次性蹦出来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 兜底：万一上游忘记带头，也别让 nginx 缓冲
        proxy_set_header X-Accel-Buffering no;
    }
}
