# 已有 nginx 的机器：把这段放进你的 server 块（不要新建 server，除非你有新子域）
#
# 关键三行：
#   proxy_buffering off;          —— 否则 SSE 被攒着，前端要等全文才显示
#   proxy_http_version 1.1;       —— 长连接必须
#   proxy_read_timeout 300s;      —— 单次生成可能 60s+
#
# 子域示例：lan.yourdomain.com → A 记录指向这台机器，证书复用你现有的

server {
    listen 443 ssl http2;
    server_name lan.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则流式失效
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
